api_version: 2.3.0
name: main-sequence-markets-static-site
scope:
  environments: [Production]
resources:
  - key: main-sequence-markets-site
    kind: static_site
    spec:
      name: Main Sequence Markets
      root_directory: ""
      framework: vite
      node_version: "24"
      output_directory: dist
      routing_mode: spa
      spa_entry_file: /index.html
      build_environment:
        # The Markets API by repository and workflow key. Main Sequence resolves
        # it to that API's release UID in this site's Environment at every build,
        # and rebuilds the site when the API is re-created. The SDK resolves the
        # release's current RPC endpoint at request time.
        VITE_FASTAPI_RELEASE_UID:
          resource_release:
            repository: MainSequenceMarkets
            key: markets-api
      automatic_redeployment:
        enabled: true
        tag_regex: null
