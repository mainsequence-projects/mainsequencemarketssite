api_version: 2.3.0
name: main-sequence-markets-static-site
scope:
  environments: [Production]
resources:
  - key: main-sequence-markets-site
    kind: static_site
    spec:
      name: Main Sequence Markets
      root_directory: ""
      framework: vite
      node_version: "24"
      output_directory: dist
      routing_mode: spa
      spa_entry_file: /index.html
      build_environment:
        # Stable main FastAPI release identity. The SDK resolves its current
        # opaque RPC endpoint at request time after automatic API redeployments.
        VITE_FASTAPI_RELEASE_UID: a9832527-17ae-46b5-9ab5-a429656e08cc
      automatic_redeployment:
        enabled: true
        tag_regex: null
